<line x1="36" y1="190" x2="1164" y2="190" stroke="#222736" stroke-width="1"/>
<text x="36" y="218" font-family="'Comfortaa','Inter','Segoe UI',-apple-system,sans-serif" font-size="12px" fill="#7a7770">AUTHENTICITY INVARIANT: No made-up buzzwords or fake cloud architectures. Every tool is shipped in the repositories above.</text>

