<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Devansh Dubey Technical Toolchain">
<defs>
  <style>
    .h-tag { font: 600 11px 'Comfortaa','Inter','Segoe UI',-apple-system,sans-serif; letter-spacing: 2px; fill: #8d8b85; text-transform: uppercase; }
    .sec-t { font: 700 13.5px 'Comfortaa','Inter','Segoe UI',-apple-system,sans-serif; letter-spacing: 1px; fill: #f2a65a; text-transform: uppercase; }
