<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff007a" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes barAnim1 { 0%, 100% { width: 92%; } 50% { width: 96%; } }
    @keyframes barAnim2 { 0%, 100% { width: 88%; } 50% { width: 93%; } }
    @keyframes barAnim3 { 0%, 100% { width: 95%; } 50% { width: 98%; } }
    @keyframes barAnim4 { 0%, 100% { width: 85%; } 50% { width: 90%; } }
    @keyframes pulseNode { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; filter: drop-shadow(0 0 6px #00f0ff); } }
    @keyframes flowDot {
      0% { transform: translateX(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(400px); opacity: 0; }
    }

    .p-node { animation: pulseNode 2s ease-in-out infinite; }
    .bar-1 { animation: barAnim1 3s ease-in-out infinite; }
    .bar-2 { animation: barAnim2 3.5s ease-in-out infinite; }
    .bar-3 { animation: barAnim3 2.8s ease-in-out infinite; }
    .bar-4 { animation: barAnim4 3.2s ease-in-out infinite; }
  </style>

  <rect width="950" height="360" rx="12" fill="#03060d" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Matrix Header -->
  <g transform="translate(30, 32)">
    <circle cx="8" cy="8" r="5" fill="#00f0ff" class="p-node"/>
    <text x="24" y="12" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00f0ff" letter-spacing="2">
      // NEURAL ARCHITECTURE &amp; OPERATIONAL TOOLCHAIN
    </text>
    <text x="740" y="12" font-family="'Courier New', monospace" font-size="11" fill="#64748b" letter-spacing="1">
      TELEMETRY: SYNCHRONIZED [4/4 CORES]
    </text>
    <line x1="0" y1="26" x2="890" y2="26" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- CARD 1: AI & AGENTIC SYSTEMS -->
  <g transform="translate(30, 80)">
    <rect width="430" height="120" rx="8" fill="url(#panelGrad)" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle cx="20" cy="24" r="4" fill="#00f0ff" filter="url(#glow)"/>
    <text x="32" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00f0ff" letter-spacing="1">
      MODULE 01: AUTONOMOUS AI &amp; LLM GRAPH
    </text>
    <text x="20" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
      LangGraph • PyTorch • Autonomous Agents • Qdrant / Pinecone • Production RAG
    </text>
    <!-- Progress Bar -->
    <rect x="20" y="72" width="390" height="6" rx="3" fill="#0f172a"/>
    <rect class="bar-1" x="20" y="72" width="370" height="6" rx="3" fill="url(#cyanLine)" filter="url(#glow)"/>
    <text x="20" y="100" font-family="'Courier New', monospace" font-size="10" fill="#64748b">
      SYSTEM CAPABILITY: <tspan fill="#00f0ff">96% / EXPERT SWARM LEVEL</tspan>
    </text>
  </g>

  <!-- CARD 2: BACKEND & DISTRIBUTED SYSTEMS -->
  <g transform="translate(490, 80)">
    <rect width="430" height="120" rx="8" fill="url(#panelGrad)" stroke="#7928ca" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle cx="20" cy="24" r="4" fill="#7928ca" filter="url(#glow)"/>
    <text x="32" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#c084fc" letter-spacing="1">
      MODULE 02: HIGH-THROUGHPUT ENGINE &amp; DB
    </text>
    <text x="20" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
      FastAPI • Python 3.12 • Go • PostgreSQL • Redis Streams • Microservices
    </text>
    <!-- Progress Bar -->
    <rect x="20" y="72" width="390" height="6" rx="3" fill="#0f172a"/>
    <rect class="bar-2" x="20" y="72" width="355" height="6" rx="3" fill="url(#purpleLine)" filter="url(#glow)"/>
    <text x="20" y="100" font-family="'Courier New', monospace" font-size="10" fill="#64748b">
      THROUGHPUT RELIABILITY: <tspan fill="#c084fc">99.98% / LOW LATENCY</tspan>
    </text>
  </g>

  <!-- CARD 3: TACTILE FRONTEND & MOTION -->
  <g transform="translate(30, 218)">
    <rect width="430" height="120" rx="8" fill="url(#panelGrad)" stroke="#00ff66" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle cx="20" cy="24" r="4" fill="#00ff66" filter="url(#glow)"/>
    <text x="32" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00ff66" letter-spacing="1">
      MODULE 03: NEXT-GEN INTERFACES &amp; MOTION
    </text>
    <text x="20" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
      Next.js 15 • React 19 • TypeScript • Tailwind CSS • Three.js • Zero CLS
    </text>
    <!-- Progress Bar -->
    <rect x="20" y="72" width="390" height="6" rx="3" fill="#0f172a"/>
    <rect class="bar-3" x="20" y="72" width="380" height="6" rx="3" fill="#00ff66" filter="url(#glow)"/>
    <text x="20" y="100" font-family="'Courier New', monospace" font-size="10" fill="#64748b">
      INTERFACE FIDELITY: <tspan fill="#00ff66">98% / TACTILE PIXEL-PERFECT</tspan>
    </text>
  </g>

  <!-- CARD 4: CLOUD ORCHESTRATION & DEVOPS -->
  <g transform="translate(490, 218)">
    <rect width="430" height="120" rx="8" fill="url(#panelGrad)" stroke="#ff007a" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle cx="20" cy="24" r="4" fill="#ff007a" filter="url(#glow)"/>
    <text x="32" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ff007a" letter-spacing="1">
      MODULE 04: CLOUD ORCHESTRATION &amp; CI/CD
    </text>
    <text x="20" y="54" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
      Docker • Kubernetes • AWS • GitHub Actions • Terraform • Linux Kernel
    </text>
    <!-- Progress Bar -->
    <rect x="20" y="72" width="390" height="6" rx="3" fill="#0f172a"/>
    <rect class="bar-4" x="20" y="72" width="345" height="6" rx="3" fill="#ff007a" filter="url(#glow)"/>
    <text x="20" y="100" font-family="'Courier New', monospace" font-size="10" fill="#64748b">
      DEPLOYMENT EFFICIENCY: <tspan fill="#ff007a">91% / FULLY AUTOMATED</tspan>
    </text>
  </g>
</svg>
