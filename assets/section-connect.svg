<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="1200" height="80" role="img" aria-label="Direct Transmission">
<defs>
  <linearGradient id="lineGlow2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#10b981"/>
    <stop offset="40%" stop-color="#f2a65a"/>
    <stop offset="100%" stop-color="#222736" stop-opacity="0.3"/>
  </linearGradient>
  <style>
    @keyframes pulseLive { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .p-live { animation: pulseLive 2s ease-in-out infinite; }
    .sec-title { font: 700 22px 'Comfortaa','Inter','Segoe UI',-apple-system,sans-serif; fill: #f4efe6; letter-spacing: 1px; }
    .sec-sub { font: 600 11px 'Comfortaa','Inter','Segoe UI',-apple-system,sans-serif; letter-spacing: 2px; fill: #8d8b85; text-transform: uppercase; }
  </style>
</defs>
<g transform="translate(10, 36)">
  <circle cx="6" cy="6" r="4.5" fill="#10b981" class="p-live"/>
  <text x="22" y="14" class="sec-title">Direct Transmission &amp; Channels</text>
  <text x="1180" y="12" class="sec-sub" text-anchor="end">OPEN FOR ROLES, DX DISCUSSIONS &amp; COLLABORATION</text>
</g>
<line x1="10" y1="62" x2="1190" y2="62" stroke="url(#lineGlow2)" stroke-width="2"/>
</svg>
