<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060c"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#020307"/>
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="textNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>

    <!-- Circuit Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanning Laser Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.3" stroke-opacity="0.15"/>
      <circle cx="0" cy="0" r="1" fill="#00f0ff" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: translateY(320px); opacity: 0; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes radarSpinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 18px rgba(0, 240, 255, 0.8)); }
    }
    @keyframes circuitFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes eq1 { 0%, 100% { height: 6px; y: 22px; } 50% { height: 20px; y: 8px; } }
    @keyframes eq2 { 0%, 100% { height: 18px; y: 10px; } 50% { height: 8px; y: 20px; } }
    @keyframes eq3 { 0%, 100% { height: 12px; y: 16px; } 50% { height: 24px; y: 4px; } }
    @keyframes eq4 { 0%, 100% { height: 22px; y: 6px; } 50% { height: 10px; y: 18px; } }
    @keyframes eq5 { 0%, 100% { height: 8px; y: 20px; } 50% { height: 16px; y: 12px; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .scan-beam { animation: scanline 4.5s linear infinite; }
    .radar-ring { transform-origin: 860px 140px; animation: radarSpin 12s linear infinite; }
    .radar-core { transform-origin: 860px 140px; animation: radarSpinReverse 8s linear infinite; }
    .title-glow { animation: pulseGlow 4s ease-in-out infinite; }
    .circuit-track { stroke-dasharray: 60, 180; animation: circuitFlow 3.5s linear infinite; }
    .eq-bar-1 { animation: eq1 0.7s ease-in-out infinite; }
    .eq-bar-2 { animation: eq2 0.9s ease-in-out infinite; }
    .eq-bar-3 { animation: eq3 0.6s ease-in-out infinite; }
    .eq-bar-4 { animation: eq4 0.8s ease-in-out infinite; }
    .eq-bar-5 { animation: eq5 1.1s ease-in-out infinite; }
    .pulse-dot { animation: blink 1.4s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="950" height="280" rx="12" fill="url(#bgGrad)"/>
  <rect width="950" height="280" rx="12" fill="url(#cyberGrid)"/>

  <!-- Scanning Laser Bar -->
  <rect class="scan-beam" x="10" y="0" width="930" height="2" fill="url(#scanGrad)"/>

  <!-- Outer Cyber Frame -->
  <polygon points="25,10 925,10 940,25 940,255 925,270 25,270 10,255 10,25" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.4"/>
  <polygon points="35,18 915,18 932,35 932,245 915,262 35,262 18,245 18,35" fill="none" stroke="#7928ca" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Tech Corner Markers -->
  <path d="M 10 40 L 10 10 L 40 10" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#subtleGlow)"/>
  <path d="M 940 40 L 940 10 L 910 10" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#subtleGlow)"/>
  <path d="M 10 240 L 10 270 L 40 270" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#subtleGlow)"/>
  <path d="M 940 240 L 940 270 L 910 270" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#subtleGlow)"/>

  <!-- Animated Circuit Lines -->
  <path class="circuit-track" d="M 20 70 L 140 70 L 170 100 L 320 100" fill="none" stroke="#00f0ff" stroke-width="1.8" filter="url(#subtleGlow)"/>
  <path class="circuit-track" d="M 930 210 L 810 210 L 780 180 L 630 180" fill="none" stroke="#ff007a" stroke-width="1.8" filter="url(#subtleGlow)"/>
  <path class="circuit-track" d="M 40 230 L 160 230 L 190 200 L 280 200" fill="none" stroke="#7928ca" stroke-width="1.5"/>

  <!-- Top Status Strip -->
  <g transform="translate(45, 36)" font-family="'Courier New', monospace" font-size="11" fill="#00f0ff" letter-spacing="1.5">
    <circle cx="4" cy="5" r="4" fill="#00ff66" class="pulse-dot" filter="url(#subtleGlow)"/>
    <text x="18" y="9" fill="#00ff66" font-weight="bold">SYSTEM STATUS: FULLY ONLINE</text>
    <text x="260" y="9" fill="#64748b">//</text>
    <text x="280" y="9" fill="#94a3b8">LOC: 28.61° N, 77.20° E</text>
    <text x="470" y="9" fill="#64748b">//</text>
    <text x="490" y="9" fill="#94a3b8">SECURITY CLEARANCE: LEVEL 0</text>
  </g>

  <!-- Audio Equalizer in Top Right -->
  <g transform="translate(860, 26)">
    <rect class="eq-bar-1" x="0" width="3" rx="1.5" fill="#00f0ff"/>
    <rect class="eq-bar-2" x="6" width="3" rx="1.5" fill="#00f0ff"/>
    <rect class="eq-bar-3" x="12" width="3" rx="1.5" fill="#7928ca"/>
    <rect class="eq-bar-4" x="18" width="3" rx="1.5" fill="#ff007a"/>
    <rect class="eq-bar-5" x="24" width="3" rx="1.5" fill="#00f0ff"/>
  </g>

  <!-- Holographic Radar Reactor (Right Side) -->
  <g class="radar-ring">
    <circle cx="860" cy="140" r="46" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="8, 6" stroke-opacity="0.6"/>
    <circle cx="860" cy="140" r="32" fill="none" stroke="#7928ca" stroke-width="1" stroke-dasharray="12, 4" stroke-opacity="0.5"/>
    <line x1="860" y1="90" x2="860" y2="190" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="810" y1="140" x2="910" y2="140" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
  </g>
  <g class="radar-core">
    <polygon points="860,118 879,151 841,151" fill="none" stroke="#ff007a" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="860" cy="140" r="6" fill="#00f0ff" filter="url(#subtleGlow)"/>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(60, 130)">
    <!-- Terminal Tag -->
    <rect x="0" y="-38" width="138" height="22" rx="4" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="0.8"/>
    <text x="8" y="-23" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00f0ff" letter-spacing="1">
      &gt; WHOAMI: ARCHITECT
    </text>

    <!-- Devansh Dubey Name Title -->
    <text class="title-glow" x="0" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="48" font-weight="900" fill="url(#textNeon)" letter-spacing="4" filter="url(#neonGlow)">
      DEVANSH DUBEY
    </text>

    <!-- Subtitle Spec -->
    <text x="2" y="58" font-family="'Courier New', monospace" font-size="13.5" font-weight="600" fill="#94a3b8" letter-spacing="2">
      <tspan fill="#00f0ff">▸</tspan> FULL-STACK ARCHITECT <tspan fill="#64748b">|</tspan> <tspan fill="#7928ca">▸</tspan> AI AGENTIC SYSTEMS <tspan fill="#64748b">|</tspan> <tspan fill="#ff007a">▸</tspan> DISTRIBUTED HIGH-PERFORMANCE
    </text>
  </g>

  <!-- Bottom Terminal Specs Line -->
  <g transform="translate(45, 245)" font-family="'Courier New', monospace" font-size="11" fill="#64748b" letter-spacing="1">
    <text x="0" y="0">
      <tspan fill="#00f0ff">CORE::</tspan> <tspan fill="#cbd5e1">AUTONOMOUS AGENTS</tspan>
      <tspan fill="#475569"> │ </tspan>
      <tspan fill="#7928ca">ARCH::</tspan> <tspan fill="#cbd5e1">EVENT-DRIVEN RAG</tspan>
      <tspan fill="#475569"> │ </tspan>
      <tspan fill="#ff007a">ENGINE::</tspan> <tspan fill="#cbd5e1">SUB-100MS BOUNDARIES</tspan>
      <tspan fill="#475569"> │ </tspan>
      <tspan fill="#00ff66">PROTOCOL::</tspan> <tspan fill="#cbd5e1">ACTIVE SHIPPING</tspan>
    </text>
  </g>
</svg>
